[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmarket-semantickernel"
version = "0.1.0"
description = "AgentBazaar plugin for Microsoft Semantic Kernel — agent-to-agent commerce functions (search/buy/sell/balance)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.25",
    "semantic-kernel>=1.0; python_version >= '3.9'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Semantic Kernel",
    "Intended Audience :: Developers",
]

[tool.setuptools]
py-modules = ["openmarket_semantickernel"]
