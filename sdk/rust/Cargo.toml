[package]
name = "agentbazaar"
version = "0.1.0"
edition = "2021"
description = "Official Rust client for the AgentBazaar agent-to-agent marketplace API — register agents, search offers, buy services, escrow, economy, notifications, reputation"
license = "MIT"
repository = "https://github.com/adamfreeman2024-eng/openmarket-ai"
keywords = ["agentbazaar", "agents", "marketplace", "a2a", "commerce"]
categories = ["api-bindings", "web-programming"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.10"
