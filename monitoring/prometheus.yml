# Prometheus scrape config — AgentBazaar (OpenMarket)
# Scrapes the OpenMarket metrics endpoint (Prometheus text format).
# Auth: token file monitoring/metrics_token (gitignored) is mounted into the
# container at /etc/prometheus/metrics_token and read as Bearer credentials.
# If the file is empty/missing, Prometheus sends no Authorization header and the
# endpoint stays public (METRICS_TOKEN unset in app).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "openmarket"
    metrics_path: /api/v1/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["openmarket:3000"]
        labels:
          app: agentbazaar
          network: testnet
